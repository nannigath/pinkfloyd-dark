<!-- SVG Placeholder Album Cover -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#f0a500"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  
  <!-- Prism -->
  <polygon points="150,100 150,250 250,175" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  <polygon points="150,100 150,250 250,175" fill="white" opacity="0.1"/>
  
  <!-- Light rays -->
  <line x1="50" y1="175" x2="150" y2="175" stroke="white" stroke-width="8" opacity="0.8"/>
  <line x1="250" y1="175" x2="350" y2="100" stroke="#ff0000" stroke-width="6" opacity="0.9"/>
  <line x1="250" y1="175" x2="350" y2="130" stroke="#ff7f00" stroke-width="6" opacity="0.9"/>
  <line x1="250" y1="175" x2="350" y2="160" stroke="#ffff00" stroke-width="6" opacity="0.9"/>
  <line x1="250" y1="175" x2="350" y2="190" stroke="#00ff00" stroke-width="6" opacity="0.9"/>
  <line x1="250" y1="175" x2="350" y2="220" stroke="#0000ff" stroke-width="6" opacity="0.9"/>
  <line x1="250" y1="175" x2="350" y2="250" stroke="#8b00ff" stroke-width="6" opacity="0.9"/>
  
  <!-- Glow -->
  <circle cx="200" cy="175" r="30" fill="white" opacity="0.2"/>
  
  <!-- Text -->
  <text x="200" y="350" text-anchor="middle" fill="white" font-family="Arial" font-size="16" opacity="0.7">
    [Placeholder Cover]
  </text>
  <text x="200" y="370" text-anchor="middle" fill="white" font-family="Arial" font-size="12" opacity="0.5">
    Add prism-cover.jpg here
  </text>
</svg>
