<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2E3239" />
    <title>Offline - Pink Floyd DSOTM</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #2e3239;
        color: #e0e5ec;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .offline-container {
        text-align: center;
        max-width: 500px;
      }

      .offline-icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
        font-weight: 600;
      }

      p {
        font-size: 1.125rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
        color: #b0b8c4;
      }

      .retry-button {
        display: inline-block;
        padding: 0.875rem 2rem;
        background: #4ecdc4;
        color: #2e3239;
        text-decoration: none;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s;
      }

      .retry-button:hover {
        transform: translateY(-2px);
        background: #45b7d1;
      }

      .cached-notice {
        margin-top: 2rem;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 0.75rem;
        font-size: 0.875rem;
        color: #7a8391;
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.5rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry — some
        features may still work if you've visited this site before.
      </p>
      <button class="retry-button" onclick="window.location.reload()">
        Try Again
      </button>

      <div class="cached-notice">
        <p>
          💡 <strong>Tip:</strong> Previously viewed pages and tracks are
          available offline.
        </p>
      </div>
    </div>

    <script>
      // Check if we're back online
      window.addEventListener("online", () => {
        window.location.reload();
      });

      // Check connection status periodically
      setInterval(() => {
        if (navigator.onLine) {
          window.location.reload();
        }
      }, 5000);
    </script>
  </body>
</html>
